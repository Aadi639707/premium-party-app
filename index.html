<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura | Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; overflow: hidden; }
        .glass { background: rgba(15,15,19,0.95); backdrop-filter: blur(10px); }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
        .slide-up { transform: translateY(0) !important; }
        .speaking { border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
    </style>
</head>
<body class="h-screen w-screen flex justify-center">
    
    <script>
        window.onerror = function(msg) { alert("ERROR: " + msg); };
        window.onunhandledrejection = function(e) { alert("FIREBASE ERROR: " + e.reason); };
    </script>

    <main class="relative w-full h-full max-w-md bg-[#0f0f13] flex flex-col overflow-hidden">
        
        <section id="view-auth" class="absolute inset-0 z-50 flex flex-col justify-center p-8 glass">
            <h1 class="text-4xl font-bold text-[#ffd700] text-center mb-10"><i class="fa-solid fa-crown"></i> AURA</h1>
            <div class="flex flex-col gap-4">
                <button id="google-login-btn" class="w-full bg-white text-black font-bold py-4 rounded-xl shadow-lg">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
                <div class="text-center text-gray-500 font-bold text-xs my-2">OR</div>
                <div id="phone-ui" class="flex flex-col gap-3">
                    <input type="tel" id="phone-number" placeholder="Phone (e.g. 9876543210)" class="w-full bg-black text-white px-5 py-4 rounded-xl border border-white/10 outline-none">
                    <button id="send-otp-btn" class="w-full bg-[#1a1a24] text-[#ffd700] font-bold py-4 rounded-xl border border-[#ffd700]/50">Send OTP</button>
                </div>
                <div id="otp-ui" class="hidden flex-col gap-3">
                    <input type="text" id="otp-code" placeholder="Enter OTP" class="w-full bg-black text-white px-5 py-4 rounded-xl text-center tracking-widest text-xl outline-none">
                    <button id="verify-otp-btn" class="w-full bg-[#ffd700] text-black font-extrabold py-4 rounded-xl">Verify & Enter</button>
                </div>
                <div id="recaptcha-container" class="mt-4 flex justify-center"></div>
            </div>
        </section>

        <section id="view-dashboard" class="hidden flex-col h-full w-full relative pt-16 pb-20">
            <header class="absolute top-0 w-full px-6 py-4 flex justify-between items-center glass z-20 border-b border-white/10">
                <h2 class="text-lg font-bold text-white">AURA</h2>
                <div class="bg-black px-4 py-1.5 rounded-full border border-[#ffd700]/30"><span id="wallet-balance" class="text-[#ffd700] font-bold text-sm">0 Coins</span></div>
            </header>
            
            <div class="flex-1 overflow-y-auto p-6 custom-scroll">
                <button id="btn-create-room" class="w-full py-4 border-2 border-dashed border-[#ffd700]/50 rounded-xl text-[#ffd700] font-bold mb-4">Launch Live Room</button>
                <div id="live-rooms-list" class="flex flex-col gap-3"></div>
            </div>

            <nav class="absolute bottom-0 w-full glass flex justify-around py-4 z-20 border-t border-white/10">
                <button class="text-[#ffd700]"><i class="fa-solid fa-house text-xl"></i></button>
                <button id="logout-btn" class="text-red-500"><i class="fa-solid fa-power-off text-xl"></i></button>
            </nav>
        </section>

        <section id="view-active-room" class="hidden absolute inset-0 z-50 bg-[#0f0f13] flex flex-col transform translate-y-full transition-transform duration-300">
            <div class="p-6 pt-12 flex justify-between items-start bg-black border-b border-white/10">
                <h2 id="active-room-title" class="text-xl font-bold text-white">Room Name</h2>
                <button id="leave-room-btn" class="text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="px-8 pt-8 grid grid-cols-4 gap-6 place-items-center" id="voice-seats"></div>
            <div class="flex-1 p-4 flex flex-col justify-end"><div id="room-text-chat" class="w-full max-h-[200px] overflow-y-auto custom-scroll flex flex-col gap-2"></div></div>
            <div class="p-4 flex gap-3 bg-black">
                <button id="mic-btn" class="w-12 h-12 rounded-full bg-[#1a1a24] text-white flex justify-center items-center"><i class="fa-solid fa-microphone-slash"></i></button>
                <input type="text" id="room-msg-input" placeholder="Message..." class="flex-1 bg-[#1a1a24] text-white px-4 rounded-full outline-none">
                <button id="room-send-btn" class="w-12 h-12 rounded-full bg-[#ffd700] text-black"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
